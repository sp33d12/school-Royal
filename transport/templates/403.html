<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/static/transport/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/static/transport/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/transport/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/static/transport/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/transport/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/transport/favicon-180.png">
<link rel="manifest" href="/static/transport/manifest.json"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>غير مصرح — 403</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1b2a4a;--gold:#f0b429;--white:#fff}
body{font-family:'Tajawal',sans-serif;background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bg-circles{position:fixed;inset:0;overflow:hidden;z-index:0}
.bc{position:absolute;border-radius:50%;opacity:.05}
.bc1{width:500px;height:500px;background:#f59e0b;top:-150px;left:-150px}
.bc2{width:350px;height:350px;background:#8b5cf6;bottom:-100px;right:-80px}
.wrap{position:relative;z-index:1;text-align:center;padding:2rem;max-width:540px;width:100%}
.icon-wrap{font-size:5rem;margin-bottom:1rem}
.err-num{font-size:7rem;font-weight:900;color:#f59e0b;line-height:1;text-shadow:0 4px 20px rgba(245,158,11,.3)}
.err-title{font-size:1.6rem;font-weight:800;color:var(--white);margin:.4rem 0 .6rem}
.err-sub{color:rgba(255,255,255,.55);font-size:1rem;margin-bottom:2rem;line-height:1.7}
.contact-box{background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.3);border-radius:16px;padding:1.25rem 1.75rem;margin-bottom:2rem;width:100%}
.cb-label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:.5rem}
.cb-name{font-size:1.1rem;font-weight:800;color:var(--gold);margin-bottom:.3rem}
.cb-phone{font-size:1.4rem;font-weight:900;color:var(--white);direction:ltr;unicode-bidi:embed;letter-spacing:.04em}
.cb-hint{font-size:.78rem;color:rgba(255,255,255,.4);margin-top:.3rem}
.btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.btn{padding:.7rem 1.5rem;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:.95rem;font-weight:700;text-decoration:none;border:none;cursor:pointer}
.btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{opacity:.9}
.btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8)}
</style>
</head>
<body>
<div class="bg-circles"><div class="bc bc1"></div><div class="bc bc2"></div></div>
<div class="wrap">
  <div class="icon-wrap">🔒</div>
  <div class="err-num">403</div>
  <div class="err-title">غير مصرح بالدخول</div>
  <div class="err-sub">ليس لديك صلاحية للوصول إلى هذه الصفحة. إذا كنت تعتقد أن هذا خطأ، تواصل مع المهندس المسؤول</div>

  <div class="contact-box">
    <div class="cb-label">⚙ للمساعدة تواصل مع</div>
    <div class="cb-name">المهندس محمد عباس</div>
    <div class="cb-phone">07716912103</div>
    <div class="cb-hint">اطلب منه إضافة الصلاحيات اللازمة لحسابك</div>
  </div>

  <div class="btns">
    <a href="/" class="btn btn-gold">🏠 الصفحة الرئيسية</a>
    <a href="/login/" class="btn btn-outline">🔑 تسجيل الدخول</a>
  </div>
</div>
</body>
</html>
