<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/static/transport/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/static/transport/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/transport/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/static/transport/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/transport/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/transport/favicon-180.png">
<link rel="manifest" href="/static/transport/manifest.json"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#1b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>تسجيل الدخول — النقل المدرسي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1b2a4a;--navy2:#243660;--gold:#f0b429;--red:#c0392b;--white:#fff;--light:#f4f6fb}
body{font-family:'Tajawal',sans-serif;background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;background:linear-gradient(135deg,#111c35 0%,#1b2a4a 50%,#0f1d35 100%);z-index:0}
.circles{position:fixed;inset:0;z-index:0;overflow:hidden}
.circle{position:absolute;border-radius:50%;opacity:.06}
.c1{width:500px;height:500px;background:var(--gold);top:-200px;left:-200px}
.c2{width:400px;height:400px;background:#3498db;bottom:-150px;right:-100px}
.c3{width:300px;height:300px;background:var(--gold);bottom:100px;left:100px}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;padding:1.5rem}
.logo-box{text-align:center;margin-bottom:2rem}
.logo-icon{width:80px;height:80px;background:linear-gradient(135deg,var(--gold),#e67e22);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:2.5rem;margin-bottom:1rem;box-shadow:0 12px 40px rgba(240,180,41,.3)}
.logo-title{font-size:1.6rem;font-weight:800;color:var(--white);letter-spacing:.01em}
.logo-sub{color:rgba(255,255,255,.5);font-size:.9rem;margin-top:.3rem}
.card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:2rem}
.error{background:rgba(192,57,43,.2);border:1px solid rgba(192,57,43,.4);color:#ff9f9f;padding:.75rem 1rem;border-radius:10px;font-size:.9rem;margin-bottom:1.25rem;text-align:center}
.group{margin-bottom:1.25rem}
.group label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:.4rem}
.group input{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;color:var(--white);font-family:'Tajawal',sans-serif;font-size:16px;transition:border-color .15s,background .15s;-webkit-appearance:none}
.group input:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.12)}
.group input::placeholder{color:rgba(255,255,255,.3)}
.btn-login{width:100%;padding:.85rem;background:linear-gradient(135deg,var(--gold),#e67e22);border:none;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:1.1rem;font-weight:700;color:var(--navy);cursor:pointer;margin-top:.5rem;transition:opacity .15s,transform .1s;letter-spacing:.02em}
.btn-login:hover{opacity:.9}
.btn-login:active{transform:scale(.98)}

@media(max-width:500px){
  .wrap{padding:1.25rem 1rem}
  .logo-icon{width:64px;height:64px;font-size:2rem}
  .logo-title{font-size:1.3rem}
  .card{padding:1.4rem 1.1rem}
  .circle{opacity:.04}
  .c1{width:300px;height:300px}
  .c2{width:280px;height:280px}
  .c3{width:200px;height:200px}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="circles">
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>
</div>
<div class="wrap">
  <div class="logo-box">
    <div class="logo-icon" style="background:#fff;overflow:hidden;padding:4px"><img src="/static/transport/logo.jpg" alt="مدرسة الرشيد" style="width:100%;height:100%;object-fit:contain"></div>
    <div class="logo-title">النقل المدرسي</div>
    <div class="logo-sub">نظام إدارة بيانات التلاميذ</div>
  </div>
  <div class="card">
    {% if error %}<div class="error">⚠ اسم المستخدم أو كلمة المرور غير صحيحة</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="group">
        <label>اسم المستخدم</label>
        <input type="text" name="username" autofocus autocomplete="username" placeholder="أدخل اسم المستخدم">
      </div>
      <div class="group">
        <label>كلمة المرور</label>
        <input type="password" name="password" autocomplete="current-password" placeholder="أدخل كلمة المرور">
      </div>
      <button type="submit" class="btn-login">دخول</button>
    </form>
  </div>
</div>
<div style="position:relative;z-index:1;text-align:center;margin-top:1.25rem">
  <div style="display:inline-flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:.5rem 1rem">
    <span style="font-size:.8rem;color:rgba(255,255,255,.4)">⚙ الدعم الفني:</span>
    <span style="font-size:.85rem;font-weight:700;color:rgba(240,180,41,.8)">م. محمد عباس</span>
    <span style="font-size:.85rem;color:rgba(255,255,255,.6);direction:ltr;unicode-bidi:embed">07716912103</span>
  </div>
</div>
</body>
</html>
